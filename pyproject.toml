[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chsl-pipeline"
version = "0.1.0"
description = "CHSL-v1 state-space observations and tests"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "pyarrow>=14,<24",
  "openpyxl>=3.1", "xarray>=2024.1", "netCDF4>=1.6",
  "scipy>=1.11", "statsmodels>=0.14", "lifelines>=0.29",
  "matplotlib>=3.8"
]
[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]
[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
