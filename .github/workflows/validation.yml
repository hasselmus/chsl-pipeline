name: CHSL-v1 validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Validate code and quarantine
        run: python -m pytest -q
      - name: Compile entry points
        run: python -m compileall -q src
      - name: Verify CLI contracts
        run: |
          python -m src.raw_ingest.fetch_sources --help
          python -m src.raw_ingest.physical_grids --help
          python -m src.raw_ingest.build_chsl_parquet --help
          python -m src.analysis.run_macro_tests --help
          python -m src.sidecar.export_ledger --help
